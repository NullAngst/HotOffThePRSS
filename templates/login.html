{% extends "auth_base.html" %}
{% block title %}Sign in{% endblock %}
{% block auth %}
<h1>Sign in</h1>
<p class="lede">Relay RSS and Atom feeds to your chat channels.</p>
<form method="post" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="field"><span>Username</span>
    <input type="text" name="username" value="{{ username }}" autocomplete="username" required autofocus maxlength="64"></label>
  <label class="field"><span>Password</span>
    <input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
  <button type="submit" class="btn btn-primary btn-block">Sign in</button>
</form>
{% endblock %}
