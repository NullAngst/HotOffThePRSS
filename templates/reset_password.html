{% extends "base.html" %}
{% block title %}Set password{% endblock %}
{% block content %}
<div class="form-page narrow">
  <header class="form-head">
    <a class="back" href="{{ url_for('settings') }}">Back to settings</a>
    <h1>New password for {{ target.username }}</h1>
    <p class="lede">They are signed out of every device when you save.</p>
  </header>
  <form method="post" class="panel stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field"><span>New password</span>
      <input type="password" name="new_password" required minlength="8" maxlength="256" autocomplete="new-password"></label>
    <label class="field"><span>Confirm</span>
      <input type="password" name="confirm" required minlength="8" maxlength="256" autocomplete="new-password"></label>
    <div class="form-actions">
      <a class="btn btn-quiet" href="{{ url_for('settings') }}">Cancel</a>
      <button type="submit" class="btn btn-primary">Set password</button>
    </div>
  </form>
</div>
{% endblock %}
